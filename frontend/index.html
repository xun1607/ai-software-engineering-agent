<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Library — AI Agent Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & tokens ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f17;
      --surface:   #141720;
      --surface2:  #1c2030;
      --border:    #252b3d;
      --border2:   #2e3650;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --accent:    #6366f1;
      --accent2:   #818cf8;
      --green:     #22c55e;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --cyan:      #06b6d4;
      --purple:    #a855f7;

      --step-validate:   #22c55e;
      --step-constraint: #f59e0b;
      --step-llm:        #818cf8;
      --step-parse:      #06b6d4;
      --step-compose:    #a855f7;
      --step-identify:   #38bdf8;
      --step-result:     #34d399;
      --step-error:      #ef4444;

      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 4px 24px rgba(0,0,0,.45);
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(20,23,32,.85);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .logo-icon { font-size: 28px; }
    .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    .logo-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: .5px; text-transform: uppercase; }
    .header-badge {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .badge {
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
      letter-spacing: .5px;
    }
    .badge-mock   { background: rgba(245,158,11,.15); color: var(--yellow); border: 1px solid rgba(245,158,11,.3); }
    .badge-live   { background: rgba(34,197,94,.15);  color: var(--green);  border: 1px solid rgba(34,197,94,.3); }
    .badge-skills { background: rgba(99,102,241,.15); color: var(--accent2); border: 1px solid rgba(99,102,241,.3); }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr;
      gap: 0;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 20px;
    }

    /* ── Panels ────────────────────────────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 600; letter-spacing: .8px;
      text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    .panel-header .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
    }
    .panel-body { padding: 16px; }

    /* ── Left sidebar ───────────────────────────────────────────────────── */
    .sidebar {
      grid-column: 1;
      grid-row: 1 / 3;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Search box */
    .search-wrap {
      position: relative;
    }
    .search-wrap .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 14px; pointer-events: none;
    }
    input[type="text"], textarea, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .search-input { padding-left: 34px !important; }

    /* Skill cards */
    .skill-list { display: flex; flex-direction: column; gap: 8px; }
    .skill-card {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .skill-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: transparent;
      transition: background .2s;
    }
    .skill-card:hover          { border-color: var(--border2); transform: translateX(2px); }
    .skill-card:hover::before  { background: var(--accent); }
    .skill-card.selected       { border-color: var(--accent); background: rgba(99,102,241,.08); }
    .skill-card.selected::before { background: var(--accent); }

    .skill-card-name    { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .skill-card-desc    { font-size: 11px; color: var(--muted); line-height: 1.45; margin-bottom: 8px; }
    .skill-card-footer  { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .pill {
      padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600;
      letter-spacing: .3px;
    }
    .pill-composite { background: rgba(168,85,247,.2); color: var(--purple); border: 1px solid rgba(168,85,247,.3); }
    .pill-atomic    { background: rgba(34,197,94,.15);  color: var(--green);  border: 1px solid rgba(34,197,94,.3); }
    .pill-tag       { background: rgba(99,102,241,.12); color: var(--accent2); border: 1px solid rgba(99,102,241,.2); }
    .score-badge    {
      margin-left: auto; font-size: 10px; font-weight: 700;
      color: var(--yellow); background: rgba(245,158,11,.1);
      padding: 2px 7px; border-radius: 20px;
      border: 1px solid rgba(245,158,11,.25);
    }

    /* ── Right: main area ─────────────────────────────────────────────── */
    .main-area {
      grid-column: 2;
      grid-row: 1 / 3;
      display: flex; flex-direction: column; gap: 16px;
      min-height: 0;
    }

    /* Input form */
    .input-panel .panel-body { display: flex; flex-direction: column; gap: 12px; }
    textarea { resize: vertical; min-height: 110px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; display: block; margin-bottom: 5px; }

    .run-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 24px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border: none; border-radius: var(--radius-sm);
      color: #fff; font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 16px rgba(99,102,241,.35);
      align-self: flex-end;
    }
    .run-btn:hover  { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.45); }
    .run-btn:active { transform: translateY(0); }
    .run-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .run-btn .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .run-btn.loading .spinner { display: block; }
    .run-btn.loading .btn-text { display: none; }

    /* ── Execution log panel ───────────────────────────────────────────── */
    .log-panel { flex: 1; min-height: 0; }
    .log-panel .panel-body {
      padding: 0;
      height: 100%;
      display: flex; flex-direction: column;
    }
    .log-toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .log-toolbar-title { font-size: 12px; font-weight: 600; color: var(--muted); flex: 1; }
    .clear-btn {
      font-size: 11px; color: var(--muted); background: none; border: none;
      cursor: pointer; font-family: inherit; padding: 4px 8px;
      border-radius: 4px; transition: color .2s, background .2s;
    }
    .clear-btn:hover { color: var(--text); background: var(--surface2); }

    .log-stream {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.6;
      scroll-behavior: smooth;
    }
    .log-stream::-webkit-scrollbar { width: 5px; }
    .log-stream::-webkit-scrollbar-track { background: transparent; }
    .log-stream::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* Log entries */
    .log-entry {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      animation: slideIn .2s ease;
      transition: background .15s;
    }
    .log-entry:hover { background: rgba(255,255,255,.03); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .log-icon   { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .log-step-tag {
      font-size: 10px; font-weight: 700; letter-spacing: .6px;
      padding: 1px 7px; border-radius: 4px; flex-shrink: 0; margin-top: 2px;
      text-transform: uppercase;
    }
    .log-skill-tag {
      font-size: 10px; color: var(--muted); flex-shrink: 0; margin-top: 2px;
      white-space: nowrap;
    }
    .log-msg   { flex: 1; color: var(--text); }
    .log-detail {
      font-size: 11px; color: var(--muted);
      margin-top: 3px; padding-left: 4px;
    }
    .log-detail span { color: var(--cyan); }

    /* Step colour map */
    .step-identify_skill  { color: var(--step-identify);   background: rgba(56,189,248,.12);  border: 1px solid rgba(56,189,248,.2); }
    .step-validate_input  { color: var(--step-validate);   background: rgba(34,197,94,.12);   border: 1px solid rgba(34,197,94,.2); }
    .step-check_constraint{ color: var(--step-constraint); background: rgba(245,158,11,.12);  border: 1px solid rgba(245,158,11,.2); }
    .step-call_llm        { color: var(--step-llm);        background: rgba(129,140,248,.12); border: 1px solid rgba(129,140,248,.2); }
    .step-parse_output    { color: var(--step-parse);      background: rgba(6,182,212,.12);   border: 1px solid rgba(6,182,212,.2); }
    .step-compose         { color: var(--step-compose);    background: rgba(168,85,247,.12);  border: 1px solid rgba(168,85,247,.2); }
    .step-safety_approval { color: var(--yellow);          background: rgba(245,158,11,.1);   border: 1px solid rgba(245,158,11,.2); }
    .step-result          { color: var(--step-result);     background: rgba(52,211,153,.12);  border: 1px solid rgba(52,211,153,.2); }
    .step-error           { color: var(--step-error);      background: rgba(239,68,68,.12);   border: 1px solid rgba(239,68,68,.2); }

    /* Output box */
    .output-box {
      margin: 8px 16px 16px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      overflow: hidden;
      animation: fadeIn .3s ease;
      display: none;
    }
    .output-box.visible { display: block; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }
    .output-box-header {
      padding: 8px 14px;
      background: rgba(34,211,153,.08);
      border-bottom: 1px solid var(--border2);
      font-size: 11px; font-weight: 600; color: var(--green);
      display: flex; align-items: center; gap: 6px;
    }
    .output-json {
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; line-height: 1.7;
      color: var(--text);
      white-space: pre;
      overflow-x: auto;
      max-height: 220px;
    }

    /* Dividers in log */
    .log-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 6px 0; opacity: .5;
    }

    /* Empty state */
    .log-empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
      height: 100%; color: var(--muted); text-align: center;
      padding: 40px;
    }
    .log-empty .empty-icon { font-size: 40px; opacity: .4; }
    .log-empty p { font-size: 13px; }

    /* ── Animations ────────────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,.4); }
      50%       { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s ease infinite;
      display: none;
    }
    .live-dot.active { display: block; }

    /* ── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .sidebar { grid-row: auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-icon">🧠</div>
  <div>
    <div class="logo-text">Universal Skill Library</div>
    <div class="logo-sub">AI Agent Execution Engine</div>
  </div>
  <div class="header-badge">
    <div class="live-dot" id="liveDot"></div>
    <span id="modeText"></span>
    <span class="badge badge-mock" id="modeBadge">Loading…</span>
    <span class="badge badge-skills" id="skillCountBadge">0 skills</span>
  </div>
</header>

<main>
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <!-- Search -->
    <div class="panel">
      <div class="panel-header"><div class="dot"></div>🔍 Skill Search (TF-IDF)</div>
      <div class="panel-body">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input"
                 placeholder="e.g. debug java null pointer…" />
        </div>
      </div>
    </div>

    <!-- Skill list -->
    <div class="panel" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
      <div class="panel-header"><div class="dot"></div>📚 Skill Library</div>
      <div class="panel-body" style="flex:1; overflow-y:auto; padding:12px;">
        <div class="skill-list" id="skillList">
          <div class="log-empty" style="height:auto; padding:20px;">
            <div class="empty-icon">⏳</div>
            <p>Loading skills…</p>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main area ── -->
  <div class="main-area">
    <!-- Input form -->
    <div class="panel input-panel">
      <div class="panel-header"><div class="dot"></div>⚙️ Execute Skill</div>
      <div class="panel-body">
        <div>
          <label>Selected Skill</label>
          <input type="text" id="selectedSkill" value="analyze-python-error" readonly
                 style="cursor:default; color:var(--accent2);" />
        </div>

        <div class="input-row">
          <div>
            <label>Stacktrace</label>
            <textarea id="inputStacktrace" rows="5">Traceback (most recent call last):
  File "test_data/buggy_code.py", line 40, in main
    controller.handle_order(order_id=42)
  File "test_data/buggy_code.py", line 35, in handle_order
    self.user_service.process_user()
  File "test_data/buggy_code.py", line 25, in process_user
    username = self.get_username()
  File "test_data/buggy_code.py", line 19, in get_username
    return self.current_user.name
AttributeError: 'NoneType' object has no attribute 'name'</textarea>
          </div>
          <div>
            <label>Source Path</label>
            <input type="text" id="inputSourcePath" value="test_data/" style="margin-bottom:8px;" />
            <label>Additional JSON input (optional)</label>
            <textarea id="inputExtra" rows="3" placeholder='{"key": "value"}'></textarea>
          </div>
        </div>

        <div style="display:flex; gap:8px;">
          <button class="run-btn" id="injectBtn" onclick="injectStacktrace()" style="flex:0;">
            <span class="btn-text">📥 Inject Stacktrace</span>
          </button>
          <button class="run-btn" id="runBtn" onclick="runSkill()">
            <div class="spinner"></div>
            <span class="btn-text">▶ Run Skill</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Execution log -->
    <div class="panel log-panel">
      <div class="panel-header">
        <div class="dot"></div>
        📟 Execution Log
        <span id="stepCounter" style="font-size:10px; color:var(--muted); margin-left:4px;"></span>
      </div>
      <div class="panel-body">
        <div class="log-toolbar">
          <span class="log-toolbar-title" id="logTitle">Waiting for execution…</span>
          <button class="clear-btn" onclick="clearLog()">✕ Clear</button>
        </div>
        <div class="log-stream" id="logStream">
          <div class="log-empty">
            <div class="empty-icon">🎯</div>
            <p>Select a skill from the library and click <strong>Run Skill</strong><br/>to see the execution pipeline live.</p>
          </div>
        </div>
        <div class="output-box" id="outputBox">
          <div class="output-box-header">✅ Final Output</div>
          <div class="output-json" id="outputJson"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const API = '';

// ─── Step metadata ───────────────────────────────────────────────────────────
const STEP_META = {
  identify_skill:   { icon: '🔍', label: 'IDENTIFY' },
  validate_input:   { icon: '✅', label: 'VALIDATE'  },
  check_constraint: { icon: '🔒', label: 'CONSTRAINT'},
  call_llm:         { icon: '🤖', label: 'LLM CALL'  },
  parse_output:     { icon: '📦', label: 'PARSE'     },
  compose:          { icon: '🔗', label: 'COMPOSE'   },
  safety_approval:  { icon: '⚠️', label: 'APPROVAL'  },
  result:           { icon: '🎉', label: 'RESULT'    },
  error:            { icon: '❌', label: 'ERROR'     },
};

// ─── State ───────────────────────────────────────────────────────────────────
let allSkills = [];
let stepCount = 0;

// ─── Init ─────────────────────────────────────────────────────────────────── 
async function init() {
  await Promise.all([fetchStatus(), fetchSkills()]);
}

async function fetchStatus() {
  try {
    const res = await fetch(`${API}/api/status`);
    const data = await res.json();
    const isMock = data.mock_mode;
    document.getElementById('modeBadge').textContent = isMock ? '🟡 MOCK MODE' : '🟢 LIVE — DeepSeek';
    document.getElementById('modeBadge').className = `badge ${isMock ? 'badge-mock' : 'badge-live'}`;
    document.getElementById('modeText').textContent = '';
  } catch(e) {
    document.getElementById('modeBadge').textContent = '⚠ API offline';
  }
}

async function fetchSkills() {
  try {
    const res = await fetch(`${API}/api/skills`);
    allSkills = await res.json();
    document.getElementById('skillCountBadge').textContent = `${allSkills.length} skills`;
    renderSkillList(allSkills);
  } catch(e) {
    document.getElementById('skillList').innerHTML = `<p style="color:var(--red); font-size:12px;">Failed to load skills. Is the API running?</p>`;
  }
}

// ─── Skill list ───────────────────────────────────────────────────────────────
function renderSkillList(skills, scores = {}) {
  const el = document.getElementById('skillList');
  if (!skills.length) {
    el.innerHTML = `<div class="log-empty" style="height:auto;"><p>No skills found.</p></div>`;
    return;
  }

  el.innerHTML = skills.map(s => {
    const levelClass = s.level === 'composite' ? 'pill-composite' : 'pill-atomic';
    const scoreBadge = scores[s.name] != null
      ? `<span class="score-badge">↑ ${scores[s.name].toFixed(3)}</span>` : '';
    const subInfo = s.sub_skills?.length
      ? `<span class="pill pill-tag">⛓ ${s.sub_skills.length} sub-skills</span>` : '';
    const tags = (s.tags || []).slice(0,2).map(t => `<span class="pill pill-tag">${t}</span>`).join('');

    return `
      <div class="skill-card" onclick="selectSkill('${s.name}')" id="card-${s.name}">
        <div class="skill-card-name">${s.name}</div>
        <div class="skill-card-desc">${s.description}</div>
        <div class="skill-card-footer">
          <span class="pill ${levelClass}">${s.level}</span>
          ${subInfo}
          ${tags}
          ${scoreBadge}
        </div>
      </div>`;
  }).join('');

  // re-highlight selected
  const selected = document.getElementById('selectedSkill').value;
  if (selected) highlightCard(selected);
}

function selectSkill(name) {
  document.getElementById('selectedSkill').value = name;
  // Adjust default inputs based on skill
  const skill = allSkills.find(s => s.name === name);
  if (skill) {
    const req = skill.input?.required || [];
    if (req.includes('stacktrace')) {
      document.getElementById('inputStacktrace').disabled = false;
    }
  }
  highlightCard(name);
}

function highlightCard(name) {
  document.querySelectorAll('.skill-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById(`card-${name}`);
  if (card) { card.classList.add('selected'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

// ─── Search ───────────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if (!q) { renderSkillList(allSkills); return; }
  searchTimer = setTimeout(() => doSearch(q), 250);
});

async function doSearch(query) {
  try {
    const res = await fetch(`${API}/api/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 10 })
    });
    const results = await res.json();
    const skills = results.map(r => r.skill);
    const scores = Object.fromEntries(results.map(r => [r.skill.name, r.score]));
    renderSkillList(skills, scores);
  } catch(e) {}
}

// ─── Inject Stacktrace ────────────────────────────────────────────────────────
async function injectStacktrace() {
  const injectBtn = document.getElementById('injectBtn');
  const originalText = injectBtn.innerHTML;
  injectBtn.disabled = true;
  injectBtn.innerHTML = '<span class="btn-text">⏳ Running test…</span>';
  
  try {
    const res = await fetch(`${API}/api/run-test-code`);
    if (!res.ok) {
      alert('Failed to run test code');
      return;
    }
    const data = await res.json();
    document.getElementById('inputStacktrace').value = data.stacktrace;
    document.getElementById('inputSourcePath').value = data.source_path;
    alert('✅ Stacktrace injected from test_data/buggy_code.py');
  } catch(e) {
    alert('Error: ' + e.message);
  } finally {
    injectBtn.disabled = false;
    injectBtn.innerHTML = originalText;
  }
}

// ─── Execute ──────────────────────────────────────────────────────────────────
async function runSkill() {
  const skillName = document.getElementById('selectedSkill').value.trim();
  if (!skillName) { alert('Please select a skill first.'); return; }

  // Build input
  const inputData = {};
  const stacktrace = document.getElementById('inputStacktrace').value.trim();
  const sourcePath  = document.getElementById('inputSourcePath').value.trim();
  if (stacktrace) inputData.stacktrace = stacktrace;
  if (sourcePath)  inputData.source_path = sourcePath;

  // Merge extra JSON
  const extra = document.getElementById('inputExtra').value.trim();
  if (extra) {
    try { Object.assign(inputData, JSON.parse(extra)); }
    catch(e) { alert('Extra JSON is invalid: ' + e.message); return; }
  }

  // UI state
  setRunning(true);
  clearLog();
  document.getElementById('logTitle').textContent = `Executing: ${skillName}`;
  stepCount = 0;

  try {
    const response = await fetch(`${API}/api/execute/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ skill_name: skillName, input_data: inputData })
    });

    if (!response.ok) {
      const err = await response.json();
      appendLog({ step: 'error', status: 'error', message: err.detail || 'Request failed', skill_name: skillName });
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') { setRunning(false); return; }
        try {
          const event = JSON.parse(raw);
          appendLog(event);
          if (event.step === 'result' && event.status === 'success' && event.data) {
            showOutput(event.data);
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    appendLog({ step: 'error', status: 'error', message: `Connection error: ${e.message}`, skill_name: skillName });
  } finally {
    setRunning(false);
  }
}

function setRunning(running) {
  const btn = document.getElementById('runBtn');
  const dot = document.getElementById('liveDot');
  btn.disabled = running;
  btn.classList.toggle('loading', running);
  dot.classList.toggle('active', running);
}

// ─── Log rendering ────────────────────────────────────────────────────────────
function appendLog(event) {
  const stream = document.getElementById('logStream');

  // Remove empty state
  const empty = stream.querySelector('.log-empty');
  if (empty) empty.remove();

  const meta = STEP_META[event.step] || { icon: '▸', label: event.step.toUpperCase() };
  const stepClass = `step-${event.step}`;

  // Divider before compose sub-calls
  if (event.step === 'compose' && event.status === 'info' && event.message?.includes('[1/')) {
    const div = document.createElement('hr');
    div.className = 'log-divider';
    stream.appendChild(div);
  }

  const entry = document.createElement('div');
  entry.className = 'log-entry';

  // Detail lines from data
  let detailHtml = '';
  if (event.data && (event.status === 'success' || event.status === 'info')) {
    const pairs = Object.entries(event.data)
      .filter(([, v]) => v !== null && v !== undefined)
      .slice(0, 4);
    if (pairs.length) {
      detailHtml = `<div class="log-detail">${
        pairs.map(([k, v]) => {
          const val = Array.isArray(v) ? v.join(', ') : String(v).slice(0,80);
          return `<span>${k}</span>: ${val}`;
        }).join('  ·  ')
      }</div>`;
    }
  }

  const skillTag = event.skill_name
    ? `<span class="log-skill-tag">(${event.skill_name})</span>` : '';

  entry.innerHTML = `
    <span class="log-icon">${meta.icon}</span>
    <span class="log-step-tag ${stepClass}">${meta.label}</span>
    ${skillTag}
    <div style="flex:1;">
      <div class="log-msg">${escHtml(event.message)}</div>
      ${detailHtml}
    </div>`;

  stream.appendChild(entry);
  stream.scrollTop = stream.scrollHeight;

  stepCount++;
  document.getElementById('stepCounter').textContent = `(${stepCount} steps)`;
}

function showOutput(data) {
  const box = document.getElementById('outputBox');
  document.getElementById('outputJson').textContent = JSON.stringify(data, null, 2);
  box.classList.add('visible');
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function clearLog() {
  document.getElementById('logStream').innerHTML = `
    <div class="log-empty">
      <div class="empty-icon">🎯</div>
      <p>Select a skill and click <strong>Run Skill</strong><br/>to see the execution pipeline live.</p>
    </div>`;
  document.getElementById('outputBox').classList.remove('visible');
  document.getElementById('outputJson').textContent = '';
  document.getElementById('logTitle').textContent = 'Waiting for execution…';
  document.getElementById('stepCounter').textContent = '';
  stepCount = 0;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
init();
</script>
